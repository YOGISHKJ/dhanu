<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy 1 Month Anniversary Dhanu ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#f6a5a5,#fbc2eb);
}

.container{
    background:#f5f5f5;
    padding:30px;
    border-radius:20px;
    text-align:center;
    width:350px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h1{
    color:#ff4d6d;
    margin-bottom:10px;
}

.heart{
    font-size:30px;
    margin:10px 0;
}

p{
    margin:10px 0;
    color:#333;
}

.images{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin:20px 0;
}

.images img{
    width:100%;
    height:120px;
    object-fit:cover;
    border-radius:15px;
}

button{
    background:#ff4d6d;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:25px;
    cursor:pointer;
    font-size:16px;
    transition:0.3s;
}

button:hover{
    background:#e63950;
}
</style>
</head>

<body>

<div class="container">
    <h1>Happy 1 Month Anniversary Dhanu ❤️</h1>
    
    <div class="heart">💖</div>

    <p>
     Happy Anniversary ❤️  
Seeing you both together fills my heart with happiness.  
May your bond grow stronger every day 💕  
Wishing you endless love and joy.  
– Your YOGI👑
    </p>

    <div class="images">
        <img src="https://picsum.photos/200?1">
        <img src="https://picsum.photos/200?2">
        <img src="https://picsum.photos/200?3">
        <img src="https://picsum.photos/200?4">
    </div>

    <button onclick="surprise()">Click for Surprise</button>
</div>

<script>
function surprise(){
    alert("Happy Anniversary Anna❤️ Aunty ❤️🎉");
}
</script>

</body>
</html>
