<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Anniversary DHANU ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    height:100vh;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

/* Card */
.card{
    background:white;
    padding:30px;
    border-radius:20px;
    width:350px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    animation:fadeIn 1.2s ease;
}

h1{
    color:#ff4d6d;
    margin-bottom:10px;
}

p{
    color:#555;
    margin-bottom:20px;
}

/* Gallery */
.gallery{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-bottom:20px;
}

.gallery img{
    width:100%;
    height:120px;
    object-fit:cover;
    border-radius:10px;
    transition:0.3s;
}

.gallery img:hover{
    transform:scale(1.1);
}

/* Button */
.btn{
    padding:10px 20px;
    background:#ff4d6d;
    color:white;
    border:none;
    border-radius:20px;
    cursor:pointer;
}

.btn:hover{
    background:#e63950;
}

/* Floating hearts */
.heart{
    position:absolute;
    bottom:-20px;
    font-size:20px;
    animation:floatUp linear infinite;
}

@keyframes floatUp{
    0%{
        transform:translateY(0);
        opacity:1;
    }
    100%{
        transform:translateY(-100vh);
        opacity:0;
    }
}

/* Fade animation */
@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>

<body>

<div class="card">
    <h1>Happy Anniversary dhanu ❤️</h1>
    <p>Still tolerating each other… great success!  
Love you always 💕💖</p>

    <div class="gallery">
        <!-- Replace these with your images -->
        <img src="https://picsum.photos/200/300?1">
        <img src="https://picsum.photos/200/300?2">
        <img src="https://picsum.photos/200/300?3">
        <img src="https://picsum.photos/200/300?4">
    </div>

    <button class="btn" onclick="showMessage()">Click for Surprise</button>
</div>

<script>
/* Floating hearts */
function createHeart(){
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤️";

    heart.style.left = Math.random()*100 + "vw";
    heart.style.animationDuration = (Math.random()*3 + 2) + "s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },5000);
}

setInterval(createHeart, 300);

/* Button message */
function showMessage(){
    alert("Happy Anniversary ❤️ I love you!");
}
</script>

</body>
</html>
