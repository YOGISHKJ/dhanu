<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy 1 Month Anniversary Dhanu ❤️</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#ff9a9e,#fad0c4);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    background:white;
    padding:30px;
    border-radius:20px;
    text-align:center;
    width:320px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h1{
    color:#ff4d6d;
}

p{
    color:#333;
    font-size:15px;
}

.images{
    margin-top:10px;
}

.images img{
    width:100px;
    height:100px;
    border-radius:10px;
    margin:5px;
}

button{
    margin-top:15px;
    padding:10px 20px;
    border:none;
    background:#ff4d6d;
    color:white;
    border-radius:20px;
    cursor:pointer;
}

button:hover{
    background:#e63950;
}
</style>
</head>

<body>

<div class="card">
    <h1>Happy 1 Month Anniversary Dhanu ❤️</h1>

    <p>
        One beautiful month with you 💕<br>
        Every moment feels special and unforgettable 💖<br>
        
    </p>

    <div class="images">
        <img src="https://picsum.photos/100?1">
        <img src="https://picsum.photos/100?2">
        <img src="https://picsum.photos/100?3">
        <img src="https://picsum.photos/100?4">
    </div>

    <button onclick="showMsg()">Click for Surprise</button>
</div>

<script>
function showMsg(){
    alert("Happy Anniversary Anna❤️ Aunty ❤️");
}
</script>

</body>
</html>
